[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "afri-ai-serving"
version = "0.1.0"
description = "Reproducible African-language AI experiments with explicit evidence status"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "prometheus-client>=0.22,<1", "uvicorn>=0.34,<1", "soundfile>=0.13,<1"]

[project.optional-dependencies]
speech = ["faster-whisper>=1.2,<2", "av>=13,<16", "huggingface-hub>=0.34,<1"]
pricing = ["ijson>=3.4,<4"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
