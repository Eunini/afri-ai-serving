name: containers and infrastructure
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check . && pytest -q
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.4'
      - run: terraform -chdir=infra fmt -recursive -check && terraform -chdir=infra init -backend=false && terraform -chdir=infra validate && terraform -chdir=infra/aws init -backend=false && terraform -chdir=infra/aws validate
      - uses: azure/setup-helm@v4.3.0
        with:
          version: 'v3.19.0'
      - run: helm lint k8s/afri-ai && helm template ci k8s/afri-ai
  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {service: speech, dockerfile: services/speech/Dockerfile}
          - {service: chat, dockerfile: services/chat/Dockerfile}
          - {service: llama, dockerfile: services/chat/Dockerfile.llama}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: LLAMA_COMMIT=6050b467c07a95c7b87debd4ddac2f8ba8d9b807
